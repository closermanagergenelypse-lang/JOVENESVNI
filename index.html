<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5E5A">
<title>Jóvenes Vida Nueva Internacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface2:#E9EFEA; --ink:#15262A; --muted:#5A6B69; --line:#D6DFD9;
  --primary:#0F5E5A; --primary-ink:#FFFFFF; --primary-soft:#DCEDEA; --sun:#E3951A;
  --ok:#2E9460; --warn:#D59A12; --bad:#CF4536;
  --t-llamada:#3B7DD8; --t-mensaje:#149C8F; --t-visita:#2E9460; --t-discipulado:#7B5CC7; --t-oracion:#E3951A; --t-iglesia:#C2527F; --t-nocontesta:#7C8886;
  --shadow:0 1px 2px rgba(15,40,38,.06),0 6px 20px rgba(15,40,38,.07);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1716; --surface:#14201F; --surface2:#1B2A28; --ink:#E5EEEC; --muted:#93A6A3; --line:#283836;
  --primary:#46B8AB; --primary-ink:#04211E; --primary-soft:#173A36; --sun:#F2B140;
  --ok:#4DC386; --warn:#E9BA3A; --bad:#F06A5A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1716; --surface:#14201F; --surface2:#1B2A28; --ink:#E5EEEC; --muted:#93A6A3; --line:#283836;
  --primary:#46B8AB; --primary-ink:#04211E; --primary-soft:#173A36; --sun:#F2B140;
  --ok:#4DC386; --warn:#E9BA3A; --bad:#F06A5A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
@media (min-width:860px){.wrap{padding-block:0 48px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.05;display:block}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.nav button[aria-current="true"]{background:var(--primary-soft);color:var(--primary)}
.nav svg{width:20px;height:20px}
@media (max-width:859px){
  .top .nav{display:none}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr)}
  .bnav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center}
}
@media (min-width:860px){.bnav{display:none}}

/* generic */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;padding:0}
.muted{color:var(--muted)}
.cap::first-letter{text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:color-mix(in srgb,var(--warn) 75%,var(--ink))}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.banner{margin-top:14px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--sun) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--sun) 35%,var(--line));font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hello{padding-top:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h1{font-size:clamp(26px,5vw,36px);font-weight:800}
.hello h1 span{color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat.alert .v{color:var(--bad)}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--primary)}

.dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-bar h3{font-size:19px;flex:1;text-transform:capitalize}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;padding-bottom:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:52px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;min-width:0}
.day .n{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.day.out{opacity:.38}
.day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.day.today .n{color:var(--primary)}
.day.sel{background:var(--primary-soft)}
.day:disabled{cursor:default;background:var(--surface2);opacity:.5}
.day:not(:disabled):hover{border-color:var(--primary)}
.main-cal .day{min-height:86px}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev-chip{font-size:11px;font-weight:600;line-height:1.25;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c)}
.ev-chip.cancel{text-decoration:line-through;opacity:.6}
.more{font-size:10.5px;color:var(--muted);font-weight:600}
@media (max-width:640px){
  .main-cal .day{min-height:58px}
  .ev-chip{font-size:0;padding:0;height:6px;border-left:0;background:var(--c);border-radius:3px}
  .more{font-size:9.5px}
}
/* seguimiento day */
.seg-day{--c:var(--line)}
.seg-day.has{background:color-mix(in srgb,var(--c) 20%,var(--surface));border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.seg-day .tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.seg-day .tag{font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:4px;background:var(--tc);color:#fff;letter-spacing:.02em}
.seg-day.gap{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--bad) 10%,transparent) 5px 10px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}

/* day panel / list items */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t,.row .s{display:block}
.row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-badge{width:46px;flex:none;text-align:center;border-radius:10px;padding:5px 0;background:color-mix(in srgb,var(--c,var(--primary)) 14%,transparent);color:color-mix(in srgb,var(--c,var(--primary)) 75%,var(--ink))}
.date-badge b{display:block;font-family:var(--display);font-size:19px;line-height:1}
.date-badge small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-family:var(--display);background:var(--primary-soft);color:var(--primary);position:relative}
.avatar.alert::after{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.avatar.lg{width:64px;height:64px;font-size:24px}
.strip{display:flex;gap:2px;flex:none}
.strip i{width:7px;height:18px;border-radius:2px;background:var(--surface2)}
@media (max-width:520px){.strip{display:none}}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* profile */
.back{margin-top:16px}
.profile{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
@media (max-width:900px){.profile{grid-template-columns:minmax(0,1fr)}}
.p-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.p-head h1{font-size:26px;font-weight:800}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.alertbox{margin-top:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.okbox{margin-top:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok);font-weight:700;font-size:14px}
.hist .row{align-items:flex-start}
.hist .note{font-size:13.5px;color:var(--ink);white-space:pre-wrap;margin-top:2px}
textarea,input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:90px}

/* groups */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.gcard:hover{border-color:var(--primary)}
.gcard h3{font-size:18px}
.gcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,20,19,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:620px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.m-head{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:20px;flex:1}
.m-body{padding:16px 18px;overflow:auto;flex:1}
.m-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.m-foot .sp{flex:1}
@media (max-width:640px){
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94dvh}
}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.opt input:checked+span{border-color:var(--oc,var(--primary));background:color-mix(in srgb,var(--oc,var(--primary)) 16%,var(--surface));color:color-mix(in srgb,var(--oc,var(--primary)) 70%,var(--ink))}
.opt input:focus-visible+span{outline:2px solid var(--primary)}
.swatch span{width:30px;height:30px;padding:0;border-radius:50%;background:var(--oc)!important;border:3px solid var(--surface)}
.swatch input:checked+span{box-shadow:0 0 0 2px var(--oc)}
.entry{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:9px 11px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.entry .main{flex:1;min-width:0}
.ev-hero{border-radius:14px;padding:14px;background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.ev-hero .when{font-weight:700;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.att-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.att-row .main{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 9px;font-size:12.5px;font-weight:800;color:var(--muted);min-width:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on-p{background:var(--ok);color:#fff}
.seg button.on-t{background:var(--warn);color:#fff}
.seg button.on-j{background:var(--t-llamada);color:#fff}
.seg button.on-a{background:var(--bad);color:#fff}
.att-sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.memb{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-weight:600}
.memb input{width:20px;height:20px;accent-color:var(--primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:860px){.toast{bottom:24px}}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--primary)"/><path d="M20 31V18" stroke="var(--primary-ink)" stroke-width="2.4" stroke-linecap="round"/><path d="M20 19c0-5 3.5-8.5 9-8.5 0 5.5-3.5 9-9 8.5Z" fill="var(--sun)"/><path d="M20 23c0-4.2-3-7-7.6-7 0 4.6 3 7.4 7.6 7Z" fill="var(--primary-ink)"/></svg>
    <div><b>Jóvenes Vida Nueva</b><small>Internacional</small></div>
  </div>
  <nav class="nav" id="nav-top"></nav>
</div></header>
<main class="wrap" id="app"><div class="loading">Cargando…</div></main>
<nav class="nav bnav" id="nav-bottom"></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fLarga=s=>{const d=parse(s);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const fCorta=s=>{const d=parse(s);return `${d.getDate()} ${MES3[d.getMonth()]}`};
const hora=h=>{if(!h)return '';const [H,M]=h.split(':').map(Number);const ap=H>=12?'p. m.':'a. m.';return `${((H+11)%12)+1}:${pad(M)} ${ap}`};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hace=n=>n===0?'hoy':n===1?'ayer':`hace ${n} días`;
const DIAS_ALERTA=3;

const TIPOS=[
 {k:'llamada',n:'Llamada',i:'LL',c:'var(--t-llamada)'},

let DB=null,MODE='loading';
const LSK='jvni-datos-v1';
const dirty=new Set(),timers={},chains={};

function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LSK)||'{}');for(const c in S)S[c]=r[c]||{}}catch(e){}}
function writeDoc(col,id){
  const key=col+'/'+id;
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    const d=S[col][id];
    try{ if(d) await DB.collection(col).doc(id).set(clone(d)); else await DB.collection(col).doc(id).delete(); }
    catch(e){ toast(e&&e.code==='quota_exceeded'?'Se alcanzó el límite de registros. Elimina algunos para continuar.':'No se pudo guardar. Revisa tu conexión o tus permisos.'); }
    finally{ if(!timers[key]) dirty.delete(key); }
  });
}
function put(col,id,data,delay){
  S[col][id]=data; render();
  if(MODE!=='db'){lsSave();return}
  const key=col+'/'+id; dirty.add(key); clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>{timers[key]=null;writeDoc(col,id)},delay||0);
}
function del(col,id){
  delete S[col][id]; render();
  if(MODE!=='db'){lsSave();return}
  const key=col+'/'+id; dirty.add(key); clearTimeout(timers[key]); timers[key]=null; writeDoc(col,id);
}
function subscribe(col){
  DB.collection(col).onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{next[d.id]=d.data()});
    for(const k of dirty){const [c,id]=k.split('/');if(c!==col)continue; if(S[col][id])next[id]=S[col][id]; else delete next[id];}
    S[col]=next; render(); refreshModal();
  },err=>{ if(err&&err.code==='revoked') toast('Tu acceso a los datos cambió.'); });
}
async function boot(){
  let db=null;
  try{ db = window.claude&&window.claude.use ? await window.claude.use('db') : null; }catch(e){db=null}
  if(db){DB=db;MODE='db';['jovenes','eventos','grupos'].forEach(subscribe)}
  else{MODE='local';lsLoad()}
  render();
}

/* ---------- lógica de negocio ---------- */
const jList=()=>Object.entries(S.jovenes).map(([id,j])=>({id,...j})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
const activos=()=>jList().filter(j=>j.activo!==false);
function segDates(j){return Object.keys(j.seg||{}).filter(d=>(j.seg[d]||[]).length).sort()}
function lastSeg(j){const ds=segDates(j);return ds.length?ds[ds.length-1]:null}
function dayWorst(list){let w='bien';(list||[]).forEach(e=>{if(RANK[e.estado]>RANK[w])w=e.estado});return w}
function jStatus(j){
  const t=today(); const last=lastSeg(j);
  const base=last||(j.creado?j.creado.slice(0,10):t);
  const dias=Math.max(0,diffDays(base,t));
  const lastEstado=last?dayWorst(j.seg[last]):null;
  const alerta=j.activo!==false && (dias>DIAS_ALERTA || lastEstado==='critico');
  let motivo='';
  if(j.activo!==false){ if(dias>DIAS_ALERTA) motivo=last?`${dias} días sin seguimiento`:`Sin seguimiento desde que se registró (${dias} días)`; else if(lastEstado==='critico') motivo='Último seguimiento marcado como crítico'; }
  return {last,dias,alerta,motivo,lastEstado};
}
function occursOn(e,ds){
  if(!e.fecha||ds<e.fecha) return false;
  const rep=e.repetir||'no';
  if(rep==='no'){const end=e.fechaFin&&e.fechaFin>e.fecha?e.fechaFin:e.fecha;return ds<=end}
  if(e.hasta&&ds>e.hasta) return false;
  const d=diffDays(e.fecha,ds);
  if(rep==='semanal') return d%7===0;
  if(rep==='quincenal') return d%14===0;
  if(rep==='mensual') return parse(ds).getDate()===parse(e.fecha).getDate();
  return false;
}
const attKey=(e,ds)=>(e.repetir||'no')==='no'?e.fecha:ds;
function eventsOn(ds){return Object.entries(S.eventos).filter(([,e])=>occursOn(e,ds)).map(([id,e])=>({id,...e})).sort((a,b)=>(a.todoElDia?'':a.horaInicio||'99').localeCompare(b.todoElDia?'':b.horaInicio||'99'))}
function upcoming(n){const out=[];let d=today();for(let i=0;i<120&&out.length<n;i++){eventsOn(d).forEach(e=>{if(out.length<n&&e.estado!=='cancelado')out.push({...e,occ:d})});d=addDays(d,1)}return out}
function asistStats(jid){let p=0,t=0;Object.values(S.eventos).forEach(e=>{Object.values(e.asistencia||{}).forEach(m=>{if(m[jid]){t++;if(m[jid]==='p'||m[jid]==='t')p++}})});Object.values(S.grupos).forEach(g=>{Object.values(g.reuniones||{}).forEach(r=>{if((g.miembros||[]).includes(jid)||(r.asistencia&&jid in r.asistencia)){t++;if(r.asistencia&&r.asistencia[jid])p++}})});return {p,t}}

/* ---------- calendario genérico ---------- */
function calendar(kind,cellFn,extraCls){
  const {y,m}=UI.cal[kind];
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((off+dim)/7);
  let g='';
  for(let i=0;i<weeks*7;i++){const d=new Date(y,m,1-off+i);g+=cellFn(ymd(d),d.getMonth()===m,d)}
  return `<div class="${extraCls||''}"><div class="cal-bar"><h3>${MESES[m]} ${y}</h3>
   <button class="btn sm" data-act="cal-today" data-k="${kind}">Hoy</button>
   <button class="icon-btn" data-act="cal-move" data-k="${kind}" data-d="-1" aria-label="Mes anterior">${IC.prev}</button>
   <button class="icon-btn" data-act="cal-move" data-k="${kind}" data-d="1" aria-label="Mes siguiente">${IC.next}</button></div>
   <div class="cal-head">${['L','M','M','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">${g}</div></div>`;
}

  const a=document.activeElement;
  if(a&&$('#app').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return}
  pendingRender=false;
  renderNav();

  let h= v==='inicio'?vInicio(): v==='jovenes'?vJovenes(): v==='joven'?vJoven(): v==='grupo'?vGrupo(): vGrupos(v);
  if(MODE==='local') h+=`<div class="banner">Modo sin conexión a la base compartida: los datos se guardan solo en este navegador.</div>`;
  $('#app').innerHTML=h;
}

function evRow(e,ds,withDate){
  const n=Object.values((e.asistencia||{})[attKey(e,ds)]||{}).filter(v=>v==='p'||v==='t').length;
  const when=e.todoElDia||!e.horaInicio?'Todo el día':`${hora(e.horaInicio)}${e.horaFin?' – '+hora(e.horaFin):''}`;
  return `<button class="row" data-act="ev-open" data-id="${e.id}" data-date="${ds}">
   ${withDate?`<span class="date-badge" style="--c:${esc(e.color||COLORES[0])}"><b>${parse(ds).getDate()}</b><small>${MES3[parse(ds).getMonth()]}</small></span>`:`<span class="dot" style="background:${esc(e.color||COLORES[0])};width:12px;height:12px"></span>`}
   <span class="main"><span class="t" ${e.estado==='cancelado'?'style="text-decoration:line-through"':''}>${esc(e.titulo)}</span><span class="s">${when}${e.lugar?' · '+esc(e.lugar):''}</span></span>
   ${n?`<span class="pill ok">${n} asist.</span>`:e.estado==='cancelado'?'<span class="pill bad">Cancelado</span>':''}</button>`;
}

function strip(j){const t=today();let h='';for(let i=13;i>=0;i--){const d=addDays(t,-i),l=(j.seg||{})[d];h+=`<i ${l&&l.length?`style="background:${ESTADO[dayWorst(l)].c}"`:''} title="${fCorta(d)}"></i>`}return `<span class="strip" aria-hidden="true">${h}</span>`}

function vGrupos(kind){
  const L=Object.entries(S.grupos).filter(([,g])=>(g.tipo||'casa')===kind).map(([id,g])=>({id,...g})).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const K=GK[kind];
  return `<div class="sec-h"><div><div class="eyebrow">Seguimiento</div><h2>${K.col}</h2></div><button class="btn pri" data-act="g-new" data-k="${kind}">+ ${K.nuevo}</button></div>
  ${L.length?`<div class="gcards">${L.map(g=>{const ds=Object.keys(g.reuniones||{}).sort();const last=ds[ds.length-1];const r=last&&g.reuniones[last];const n=r?Object.values(r.asistencia||{}).filter(Boolean).length+(+r.visitas||0):0;const d=last?diffDays(last,today()):null;
   return `<button class="card gcard" data-act="g-open" data-id="${g.id}"><h3>${esc(g.nombre)}</h3><span class="muted" style="font-size:13.5px">${esc([g.encargado,g.dia?(g.dia+(g.hora?' '+hora(g.hora):'')):''].filter(Boolean).join(' · ')||'Sin datos de horario')}</span>
    <span class="meta"><span class="pill">${(g.miembros||[]).length} jóvenes</span>${last?`<span class="pill ${d>8?'warn':'ok'}">Última ${K.reu.toLowerCase()} ${hace(d)}</span><span class="pill">${n} asistentes</span>`:`<span class="pill warn">Sin ${K.reu.toLowerCase()}es registrad${kind==='casa'?'a':'o'}s</span>`}</span></button>`}).join('')}</div>`
  :`<div class="card empty"><b>Aún no hay ${K.col.toLowerCase()}</b>Registra ${kind==='casa'?'cada casa de oración con su líder y horario':'la congregación o sedes'} para llevar la asistencia de cada ${K.reu.toLowerCase()}.</div>`}`;
}
function vGrupo(){
  const g=S.grupos[UI.id]; if(!g){UI.view='casa';return vGrupos('casa')}

  const miembros=(g.miembros||[]).map(id=>({id,...S.jovenes[id]})).filter(j=>j.nombre);
  const cell=(ds,inM)=>{const r=(g.reuniones||{})[ds];const n=r?Object.values(r.asistencia||{}).filter(Boolean).length+(+r.visitas||0):0;const fut=ds>t;
   return `<button class="day seg-day${inM?'':' out'}${r?' has':''}${ds===t?' today':''}" ${fut?'disabled':''} data-act="g-day" data-date="${ds}" style="--c:var(--primary)"><span class="n">${parse(ds).getDate()}</span>${r?`<span class="tags"><span class="tag num" style="--tc:var(--primary)">${n}</span></span>`:''}</button>`};

    <div class="card"><div class="sec-h" style="margin:0 0 4px"><h2 style="font-size:18px">Historial</h2><button class="btn sm pri" data-act="g-day" data-date="${t}">+ Registrar hoy</button></div>
     ${ds.length?`<div class="list">${ds.slice(0,15).map((d,i)=>{const r=g.reuniones[d];return `<button class="row" data-act="g-day" data-date="${d}"><span class="date-badge"><b>${parse(d).getDate()}</b><small>${MES3[parse(d).getMonth()]}</small></span><span class="main"><span class="t">${esc(r.tema||K.reu)}</span><span class="s">${[r.predicador,r.notas].filter(Boolean).map(esc).join(' · ')||'Sin observaciones'}</span></span><span class="pill num">${tot[i]}</span></button>`}).join('')}</div>`:`<p class="muted" style="margin:0">No hay registros todavía.</p>`}
    </div>
   </div>
   <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
     <div class="p-head"><span class="avatar lg" style="border-radius:16px">${IC[kind].replace('<svg','<svg width="30" height="30"')}</span><div style="flex:1;min-width:0"><div class="eyebrow">${K.one}</div><h1>${esc(g.nombre)}</h1></div><button class="btn sm" data-act="g-edit" data-id="${UI.id}">Editar</button></div>
     <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span class="v">${miembros.length}</span><span class="l">Jóvenes</span></div><div class="stat"><span class="v">${ds.length}</span><span class="l">Registros</span></div><div class="stat"><span class="v">${prom}</span><span class="l">Promedio</span></div></div>
     <dl class="kv">
      ${g.encargado?`<dt>${K.enc}</dt><dd>${esc(g.encargado)}</dd>`:''}${g.anfitrion?`<dt>${K.host}</dt><dd>${esc(g.anfitrion)}</dd>`:''}
      ${g.telefono?`<dt>Teléfono</dt><dd class="num">${esc(g.telefono)}</dd>`:''}${g.direccion?`<dt>Dirección</dt><dd>${esc(g.direccion)}</dd>`:''}
      ${g.dia?`<dt>Horario</dt><dd>${esc(g.dia)} ${hora(g.hora)}</dd>`:''}${g.notas?`<dt>Notas</dt><dd style="white-space:pre-wrap">${esc(g.notas)}</dd>`:''}
     </dl>
    </div>
    <div class="card"><div class="sec-h" style="margin:0 0 4px"><h2 style="font-size:18px">Jóvenes que asisten</h2><button class="btn sm" data-act="g-members">Editar lista</button></div>
     ${miembros.length?`<div class="list">${miembros.map(j=>{const s=jStatus(j);return `<button class="row" data-act="j-open" data-id="${j.id}"><span class="avatar${s.alerta?' alert':''}">${esc(initials(j.nombre))}</span><span class="main"><span class="t">${esc(j.nombre)}</span><span class="s">${s.last?'Seguimiento '+hace(s.dias):'Sin seguimientos'}</span></span></button>`}).join('')}</div>`:`<p class="muted" style="margin:0">Agrega los jóvenes que pertenecen aquí para marcar su asistencia.</p>`}
    </div>

let modalFn=null;
function openModal(fn){modalFn=fn;drawModal();}
function drawModal(){if(!modalFn){$('#modal').innerHTML='';return}const {title,body,foot,sub}=modalFn();
  $('#modal').innerHTML=`<div class="modal-bg" data-act="bg-close"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-head"><div style="flex:1;min-width:0">${sub?`<div class="eyebrow">${sub}</div>`:''}<h2>${title}</h2></div><button class="icon-btn" data-act="m-close" aria-label="Cerrar">${IC.x}</button></div><div class="m-body">${body}</div>${foot?`<div class="m-foot">${foot}</div>`:''}</div></div>`;}
function refreshModal(){if(modalFn&&modalFn.live){const a=document.activeElement;if(a&&$('#modal').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;const sc=$('#modal .m-body')?.scrollTop;drawModal();const b=$('#modal .m-body');if(b&&sc)b.scrollTop=sc}}
function closeModal(){modalFn=null;$('#modal').innerHTML='';}
const F=(label,inner,full)=>`<label class="field${full?' full':''}"><span>${label}</span>${inner}</label>`;
const inp=(name,val,type,extra)=>`<input type="${type||'text'}" name="${name}" id="f-${name}" value="${esc(val||'')}" ${extra||''}>`;
const sel=(name,val,opts)=>`<select name="${name}" id="f-${name}">${opts.map(o=>{const [v,n]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(n)}</option>`}).join('')}</select>`;
function armDelete(btn,fn){if(btn.classList.contains('arm')){fn()}else{btn.classList.add('arm');btn.textContent='Confirmar: eliminar';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('arm');btn.textContent='Eliminar'}},4000)}}

let evTab='det', attQ='';

    :`<div class="att-sum"><span class="pill ok">${cnt.p} presentes</span><span class="pill warn">${cnt.t} tarde</span><span class="pill" style="color:var(--t-llamada)">${cnt.j} justificados</span><span class="pill bad">${cnt.a} ausentes</span><span class="pill">${L.length-Object.keys(m).filter(x=>L.some(j=>j.id===x)).length} sin marcar</span></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><input class="search" id="attq" type="search" placeholder="Buscar joven" value="${esc(attQ)}" style="min-width:140px"><button class="btn sm" data-act="att-all">Todos presentes</button><button class="btn sm ghost" data-act="att-clear">Limpiar</button></div>
     ${L.length?L.map(j=>`<div class="att-row"><span class="avatar" style="width:32px;height:32px;font-size:13px">${esc(initials(j.nombre))}</span><span class="main">${esc(j.nombre)}</span><span class="seg" role="group" aria-label="Asistencia de ${esc(j.nombre)}">${[['p','P','Presente'],['t','T','Tarde'],['j','J','Justificado'],['a','A','Ausente']].map(([v,l,n])=>`<button data-act="att-set" data-j="${j.id}" data-v="${v}" class="${m[j.id]===v?'on-'+v:''}" title="${n}" aria-pressed="${m[j.id]===v}">${l}</button>`).join('')}</span></div>`).join(''):`<p class="muted">${activos().length?'Sin resultados.':'Agrega jóvenes para marcar asistencia.'}</p>`}
     <label class="field" style="margin-top:12px;max-width:220px"><span>Visitantes / nuevos (cantidad)</span><input type="number" min="0" id="visit" value="${esc(vis)}" inputmode="numeric"></label>
     <p class="muted" style="font-size:12px;margin:8px 0 0">P presente · T tarde · J justificado · A ausente. Se guarda al tocar.</p>`}`,
   foot:`<button class="btn" data-act="ev-edit" data-id="${id}">Editar evento</button><button class="btn pri" data-act="m-close">Listo</button>`}
  },{live:true}));
  evDetail.ctx={id,ds};
}
function gForm(id,kind){
  const g=id?S.grupos[id]:{tipo:kind}; const K=GK[g.tipo||kind];
  openModal(()=>({title:id?'Editar '+K.one.toLowerCase():K.nuevo,
   body:`<form class="form" data-form="grupo" data-id="${id||''}" data-k="${g.tipo||kind}" id="gform">
    ${F('Nombre *',inp('nombre',g.nombre,'text',`required placeholder="${kind==='congregacion'?'Ej: Sede Norte':'Ej: Casa de oración familia Pérez'}"`),true)}
    ${F(K.enc,inp('encargado',g.encargado))}${F(K.host,inp('anfitrion',g.anfitrion))}
    ${F('Teléfono',inp('telefono',g.telefono,'tel'))}${F('Dirección',inp('direccion',g.direccion))}
    ${F('Día de reunión',sel('dia',g.dia||'',[['','Sin definir'],'Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo']))}${F('Hora',inp('hora',g.hora,'time'))}
    ${F('Notas',`<textarea name="notas" id="f-gnotas" rows="3">${esc(g.notas||'')}</textarea>`,true)}
   </form>`,
   foot:`${id?`<button class="btn danger" data-act="g-del" data-id="${id}">Eliminar</button><span class="sp"></span>`:''}<button class="btn" data-act="m-close">Cancelar</button><button class="btn pri" type="submit" form="gform">Guardar</button>`}));
}
function membersModal(gid){
  const g=S.grupos[gid],set=new Set(g.miembros||[]);
  openModal(()=>({title:'Jóvenes que asisten',sub:esc(g.nombre),
   body:`<form data-form="members" id="mform">${jList().length?jList().map(j=>`<label class="memb"><input type="checkbox" name="m" value="${j.id}" ${set.has(j.id)?'checked':''}>${esc(j.nombre)}${j.activo===false?' <span class="pill">Inactivo</span>':''}</label>`).join(''):'<p class="muted">Primero agrega jóvenes en la sección Jóvenes.</p>'}</form>`,
   foot:`<button class="btn" data-act="m-close">Cancelar</button><button class="btn pri" type="submit" form="mform">Guardar lista</button>`}));
}
let showAll=false;
function reuModal(gid,ds){
  showAll=false;
  const draw=()=>{
   const g=S.grupos[gid]; const K=GK[g.tipo||'casa']; const r=(g.reuniones||{})[ds]||{};
   const base=new Set(g.miembros||[]); Object.keys(r.asistencia||{}).forEach(x=>base.add(x));
   const L=(showAll?jList():jList().filter(j=>base.has(j.id)));
   return {title:`${K.reu} · ${esc(g.nombre)}`,sub:fLarga(ds),
   body:`<form class="form" data-form="reunion" id="rform">
    ${F('Tema / enseñanza',inp('tema',r.tema),true)}
    ${F(g.tipo==='congregacion'?'Predicador':'Quién dirigió',inp('predicador',r.predicador))}
    ${F('Visitantes',inp('visitas',r.visitas,'number','min="0" inputmode="numeric"'))}
    ${F('Nuevos convertidos / reconciliados',inp('nuevos',r.nuevos,'number','min="0" inputmode="numeric"'))}
    ${F('Ofrenda (opcional)',inp('ofrenda',r.ofrenda))}
    <div class="field full"><span>Asistencia de jóvenes</span>
     ${L.length?L.map(j=>`<label class="memb"><input type="checkbox" name="a" value="${j.id}" ${(r.asistencia||{})[j.id]?'checked':''}>${esc(j.nombre)}</label>`).join(''):`<p class="muted" style="margin:0">No hay jóvenes asignados. ${jList().length?'':'Agrégalos en la sección Jóvenes.'}</p>`}
     ${jList().length&&!showAll?`<button type="button" class="btn sm" data-act="reu-all" style="align-self:flex-start;margin-top:8px">Mostrar todos los jóvenes</button>`:''}
    </div>
    ${F('Peticiones de oración',`<textarea name="peticiones" id="f-pet" rows="3">${esc(r.peticiones||'')}</textarea>`,true)}
    ${F('Observaciones',`<textarea name="notas" id="f-rnotas" rows="3">${esc(r.notas||'')}</textarea>`,true)}
   </form>`,
   foot:`${r.tema!=null||r.asistencia?`<button class="btn danger" data-act="reu-del">Eliminar</button><span class="sp"></span>`:''}<button class="btn" data-act="m-close">Cancelar</button><button class="btn pri" type="submit" form="rform">Guardar</button>`}};
  openModal(draw); reuModal.ctx={gid,ds};
}

/* ---------- acciones ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function go(view,id){UI.view=view;UI.id=id||null;render();window.scrollTo(0,0)}
const ACT={
 nav:t=>go(t.dataset.v),
 'go-alertas':()=>{UI.filtro='alerta';go('jovenes')},
 'go-alertas-list':()=>{UI.filtro='alerta';go('jovenes')},
 'cal-move':t=>{const c=UI.cal[t.dataset.k];let m=c.m+ +t.dataset.d,y=c.y;if(m<0){m=11;y--}if(m>11){m=0;y++}c.m=m;c.y=y;render()},
 'cal-today':t=>{const c=UI.cal[t.dataset.k];c.y=now.getFullYear();c.m=now.getMonth();if(t.dataset.k==='main')UI.selDay=today();render()},
 'main-day':t=>{UI.selDay=t.dataset.date;render();if(innerWidth<900)$('#daypanel')?.scrollIntoView({behavior:'smooth',block:'start'})},
 'ev-new':t=>evForm(null,t.dataset.date),
 'ev-open':t=>evDetail(t.dataset.id,t.dataset.date),
 'ev-edit':t=>evForm(t.dataset.id),
 'ev-tab':t=>{evTab=t.dataset.t;drawModal()},
 'ev-del':t=>armDelete(t,()=>{del('eventos',t.dataset.id);closeModal();toast('Evento eliminado')}),
 'att-set':t=>{const {id,ds}=evDetail.ctx;const e=clone(S.eventos[id]);const k=attKey(e,ds);e.asistencia=e.asistencia||{};const m=e.asistencia[k]=e.asistencia[k]||{};if(m[t.dataset.j]===t.dataset.v)delete m[t.dataset.j];else m[t.dataset.j]=t.dataset.v;put('eventos',id,e,700);drawKeep()},
 'att-all':()=>{const {id,ds}=evDetail.ctx;const e=clone(S.eventos[id]);const k=attKey(e,ds);e.asistencia=e.asistencia||{};const m=e.asistencia[k]=e.asistencia[k]||{};activos().forEach(j=>{if(!m[j.id])m[j.id]='p'});put('eventos',id,e,300);drawKeep()},
 'att-clear':()=>{const {id,ds}=evDetail.ctx;const e=clone(S.eventos[id]);if(e.asistencia)delete e.asistencia[attKey(e,ds)];put('eventos',id,e,300);drawKeep()},
 'j-new':()=>jForm(null),
 'j-open':t=>{closeModal();const j=S.jovenes[t.dataset.id];if(!j)return;UI.cal.joven={y:now.getFullYear(),m:now.getMonth()};go('joven',t.dataset.id)},
 'j-edit':t=>jForm(t.dataset.id),
 'j-del':t=>armDelete(t,()=>{del('jovenes',t.dataset.id);closeModal();go('jovenes');toast('Joven eliminado')}),
 'j-day':t=>segModal(UI.id,t.dataset.date),
 'seg-del':t=>armDelete(t,()=>{const {jid,ds}=segModal.ctx;const j=clone(S.jovenes[jid]);j.seg[ds].splice(+t.dataset.i,1);if(!j.seg[ds].length)delete j.seg[ds];put('jovenes',jid,j);drawModal();toast('Seguimiento eliminado')}),
 copy:t=>{const v=t.dataset.t;const ok=()=>toast('Número copiado');try{navigator.clipboard.writeText(v).then(ok,()=>toast(v))}catch(e){toast(v)}},
 filtro:t=>{UI.filtro=t.dataset.f;render()},
 'g-new':t=>gForm(null,t.dataset.k),
 'g-open':t=>{UI.cal.grupo={y:now.getFullYear(),m:now.getMonth()};go('grupo',t.dataset.id)},
 'g-edit':t=>gForm(t.dataset.id),
 'g-del':t=>armDelete(t,()=>{const k=S.grupos[t.dataset.id]?.tipo||'casa';del('grupos',t.dataset.id);closeModal();go(k);toast('Eliminado')}),
 'g-members':()=>membersModal(UI.id),
 'g-day':t=>reuModal(UI.id,t.dataset.date),
 'reu-all':()=>{showAll=true;const f=$('#rform');const keep=f?new FormData(f):null;drawModal();if(keep){const f2=$('#rform');for(const [k,v] of keep.entries()){if(k==='a'){const c=f2.querySelector(`input[name=a][value="${v}"]`);if(c)c.checked=true}else if(f2.elements[k])f2.elements[k].value=v}}},
 'reu-del':t=>armDelete(t,()=>{const {gid,ds}=reuModal.ctx;const g=clone(S.grupos[gid]);delete g.reuniones[ds];put('grupos',gid,g);closeModal();toast('Registro eliminado')}),
 'm-close':()=>closeModal(),
 'bg-close':(t,e)=>{if(e.target===t)closeModal()}
};
function drawKeep(){const sc=$('#modal .m-body')?.scrollTop;drawModal();const b=$('#modal .m-body');if(b&&sc)b.scrollTop=sc}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;if(a==='bg-close'&&e.target!==t)return;if(ACT[a]){e.preventDefault&&t.tagName!=='A'&&e.preventDefault();ACT[a](t,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalFn)closeModal()});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){UI.q=e.target.value;const l=$('#jlist');if(l)l.innerHTML=jRows()}
  if(e.target.id==='attq'){attQ=e.target.value;const pos=e.target.selectionStart;drawKeep();const q=$('#attq');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('change',e=>{
  if(e.target.id==='visit'){const {id,ds}=evDetail.ctx;const ev=clone(S.eventos[id]);const k=attKey(ev,ds);ev.visitantes=ev.visitantes||{};ev.visitantes[k]=e.target.value;put('eventos',id,ev,300)}
});
const FORMS={
 joven:f=>{const d=Object.fromEntries(new FormData(f));const id=f.dataset.id;const j=id?clone(S.jovenes[id]):{creado:new Date().toISOString(),seg:{}};
   ['nombre','telefono','email','nacimiento','etapa','direccion','barrio','lider','casa','acudiente'].forEach(k=>j[k]=(d[k]||'').trim());j.activo=!!d.activo;
   if(!j.nombre)return;const nid=id||uid('j');
   // sincroniza membresía de casa
   Object.entries(S.grupos).forEach(([gid,g])=>{if((g.tipo||'casa')!=='casa')return;const has=(g.miembros||[]).includes(nid);if(gid===j.casa&&!has){const c=clone(g);c.miembros=[...(c.miembros||[]),nid];put('grupos',gid,c)}});
   put('jovenes',nid,j);closeModal();toast(id?'Datos actualizados':'Joven agregado');if(!id)go('joven',nid)},
 seg:f=>{const d=Object.fromEntries(new FormData(f));const {jid,ds}=segModal.ctx;const j=clone(S.jovenes[jid]);j.seg=j.seg||{};(j.seg[ds]=j.seg[ds]||[]).push({tipo:d.tipo,estado:d.estado,nota:(d.nota||'').trim(),t:Date.now()});put('jovenes',jid,j);closeModal();toast('Seguimiento guardado')},
 obs:f=>{const j=clone(S.jovenes[UI.id]);j.obs=f.elements.obs.value;document.activeElement?.blur();put('jovenes',UI.id,j);toast('Observaciones guardadas')},
 evento:f=>{const d=Object.fromEntries(new FormData(f));const id=f.dataset.id;const e=id?clone(S.eventos[id]):{creado:new Date().toISOString(),asistencia:{}};
   ['titulo','tipo','estado','color','fecha','fechaFin','horaInicio','horaFin','horaEquipo','repetir','hasta','publico','lugar','direccion','responsable','predicador','alabanza','cupo','costo','llevar','obs'].forEach(k=>e[k]=(d[k]||'').trim());e.todoElDia=!!d.todoElDia;
   if(!e.titulo||!e.fecha)return; if(e.fechaFin&&e.fechaFin<e.fecha)e.fechaFin='';
   const nid=id||uid('e');put('eventos',nid,e);UI.selDay=e.fecha;const p=parse(e.fecha);UI.cal.main={y:p.getFullYear(),m:p.getMonth()};closeModal();render();toast(id?'Evento actualizado':'Evento creado')},
 grupo:f=>{const d=Object.fromEntries(new FormData(f));const id=f.dataset.id;const g=id?clone(S.grupos[id]):{tipo:f.dataset.k,miembros:[],reuniones:{}};
   ['nombre','encargado','anfitrion','telefono','direccion','dia','hora','notas'].forEach(k=>g[k]=(d[k]||'').trim());if(!g.nombre)return;const nid=id||uid('g');put('grupos',nid,g);closeModal();toast('Guardado');if(!id)go('grupo',nid)},
 members:f=>{const g=clone(S.grupos[UI.id]);g.miembros=new FormData(f).getAll('m');put('grupos',UI.id,g);closeModal();toast('Lista actualizada')},
 reunion:f=>{const fd=new FormData(f);const {gid,ds}=reuModal.ctx;const g=clone(S.grupos[gid]);g.reuniones=g.reuniones||{};
   const r={tema:(fd.get('tema')||'').trim(),predicador:(fd.get('predicador')||'').trim(),visitas:fd.get('visitas')||'',nuevos:fd.get('nuevos')||'',ofrenda:(fd.get('ofrenda')||'').trim(),peticiones:fd.get('peticiones')||'',notas:fd.get('notas')||'',asistencia:{}};
   fd.getAll('a').forEach(id=>r.asistencia[id]=true);g.reuniones[ds]=r;put('grupos',gid,g);closeModal();toast('Registro guardado')}
};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(FORMS[f.dataset.form])FORMS[f.dataset.form](f)});

render();
boot();
})();
</script>
</body>
</html>
